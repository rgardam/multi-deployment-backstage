nodeLinker: node-modules
# Like pnpm's store: node_modules files are hardlinks into one content store
# per machine, so a reinstall links files instead of copying ~2 GB of them.
# (Docker builds override this with YARN_NM_MODE=classic: hardlinks cannot
# cross from the build cache into an image layer.)
nmMode: hardlinks-global
# Like pnpm: dependencies' install scripts do not run, except for the
# packages allowed in package.json "dependenciesMeta" (<name>: built: true).
enableScripts: false
npmMinimalAgeGate: 3d
npmPreapprovedPackages:
  - '@backstage/*'

yarnPath: .yarn/releases/yarn-4.13.0.cjs
