# Split Backstage deployment: one gateway, one frontend, independently built
# and scaled backends, and a catalog split into three shards behind a router.
# Images are built by the Taskfile (`task build`); start with `task up`.
#
# Every image tag is TAG (default dev) unless a per-service <SERVICE>_TAG is
# set; `task up:released` sets those to the versions in deploy/releases.json.

name: backstage-poc

x-backend-env: &backend-env
  APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
  BACKEND_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
  INTERNAL_GATEWAY_URL: http://gateway:8080
  POSTGRES_HOST: postgres
  POSTGRES_PORT: '5432'
  POSTGRES_USER: backstage
  POSTGRES_PASSWORD: backstage
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # Whose OIDC tokens CI may read the catalog with (deploy/external-access.yaml).
  # Defaults to the local stand-in, ci-oidc; README "CI access" has GitHub's.
  CI_OIDC_ISSUER: ${CI_OIDC_ISSUER:-http://ci-oidc:8080}
  CI_OIDC_JWKS_URL: ${CI_OIDC_JWKS_URL:-http://ci-oidc:8080/.well-known/jwks}
  CI_OIDC_AUDIENCE: ${CI_OIDC_AUDIENCE:-backstage-ci}

# Config every backend loads on top of its image's (catalog shards list it
# again: their own volumes replace this list)
x-external-access: &external-access ./deploy/external-access.yaml:/app/config.d/30-external-access.yaml:ro

x-backend: &backend
  init: true
  restart: unless-stopped
  environment: *backend-env
  volumes:
    - *external-access
  depends_on:
    postgres:
      condition: service_healthy
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - 'fetch("http://127.0.0.1:7007/.backstage/health/v1/readiness").then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))'
    interval: 5s
    timeout: 5s
    retries: 60
    start_period: 10s

x-catalog-shard: &catalog-shard
  <<: *backend
  image: ${IMAGE_PREFIX:-backstage-poc}/backend-catalog:${BACKEND_CATALOG_TAG:-${TAG:-dev}}

services:
  gateway:
    image: ${IMAGE_PREFIX:-backstage-poc}/gateway:${GATEWAY_TAG:-${TAG:-dev}}
    restart: unless-stopped
    ports:
      - ${GATEWAY_PORT:-8080}:8080
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 5s
      retries: 20

  app:
    image: ${IMAGE_PREFIX:-backstage-poc}/app:${APP_TAG:-${TAG:-dev}}
    restart: unless-stopped
    environment:
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      BACKEND_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 5s
      retries: 20

  backend-core:
    <<: *backend
    image: ${IMAGE_PREFIX:-backstage-poc}/backend-core:${BACKEND_CORE_TAG:-${TAG:-dev}}

  backend-scaffolder:
    <<: *backend
    image: ${IMAGE_PREFIX:-backstage-poc}/backend-scaffolder:${BACKEND_SCAFFOLDER_TAG:-${TAG:-dev}}

  backend-search:
    <<: *backend
    image: ${IMAGE_PREFIX:-backstage-poc}/backend-search:${BACKEND_SEARCH_TAG:-${TAG:-dev}}

  backend-techdocs:
    <<: *backend
    image: ${IMAGE_PREFIX:-backstage-poc}/backend-techdocs:${BACKEND_TECHDOCS_TAG:-${TAG:-dev}}

  # A local plugin (plugins/scorecards-backend) deployed as its own service
  backend-scorecards:
    <<: *backend
    image: ${IMAGE_PREFIX:-backstage-poc}/backend-scorecards:${BACKEND_SCORECARDS_TAG:-${TAG:-dev}}

  # Serves /api/catalog for every shard: routes on the request's own query
  # parameters and fans out (and merges) when several shards may match.
  catalog-router:
    image: ${IMAGE_PREFIX:-backstage-poc}/catalog-router:${CATALOG_ROUTER_TAG:-${TAG:-dev}}
    init: true
    restart: unless-stopped
    environment:
      CATALOG_SHARDS_FILE: /config/catalog-shards.json
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./deploy/catalog-shards.json:/config/catalog-shards.json:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://127.0.0.1:7007/healthz").then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))'
      interval: 5s
      retries: 20

  # Three deployments of the same catalog image. The shared topology file and
  # a per-shard file (name, database, locations) make each one a shard.
  catalog-org:
    <<: *catalog-shard
    volumes:
      - ./deploy/catalog-shards.json:/app/config.d/10-catalog-shards.json:ro
      - ./deploy/catalog/org.yaml:/app/config.d/20-shard.yaml:ro
      - *external-access

  catalog-payments:
    <<: *catalog-shard
    volumes:
      - ./deploy/catalog-shards.json:/app/config.d/10-catalog-shards.json:ro
      - ./deploy/catalog/payments.yaml:/app/config.d/20-shard.yaml:ro
      - *external-access

  catalog-default:
    <<: *catalog-shard
    volumes:
      - ./deploy/catalog-shards.json:/app/config.d/10-catalog-shards.json:ro
      - ./deploy/catalog/default.yaml:/app/config.d/20-shard.yaml:ro
      - *external-access

  # Stand-in for a CI platform's OIDC token service, shaped like GitHub
  # Actions' (docker/ci-oidc/server.mjs). CI asks it for a short-lived token on
  # localhost:8090; backends check those tokens against its public keys. Not
  # part of Backstage: with GitHub Actions, GitHub plays this part.
  ci-oidc:
    image: node:24-alpine
    init: true
    restart: unless-stopped
    user: node
    command: [node, /srv/server.mjs]
    environment:
      ISSUER: http://ci-oidc:8080
      REQUEST_TOKEN: ${CI_OIDC_REQUEST_TOKEN:-local-ci-request-token}
      REPOSITORY: rgardam/rgardam
      REF: refs/heads/main
    volumes:
      - ./docker/ci-oidc/server.mjs:/srv/server.mjs:ro
      # The signing key, kept across restarts
      - ci-oidc:/home/node
    ports:
      - 127.0.0.1:${CI_OIDC_PORT:-8090}:8080
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://127.0.0.1:8080/healthz").then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))'
      interval: 5s
      retries: 20

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: backstage
      POSTGRES_PASSWORD: backstage
      # Byte-order collation, so shards sort strings exactly like the router
      # does when it merges their results
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    # Every plugin of every replica holds a small pool
    command: [postgres, -c, max_connections=400]
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U backstage]
      interval: 2s
      retries: 30

volumes:
  postgres:
  ci-oidc:
